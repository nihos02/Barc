env: local

spring:
  application:
    name: url-management-service-api
  datasource:
    url: jdbc:oracle:thin:@bcu2-12-pi-uat.intranet.barcapint.com:3521/djpr_svc
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USERNAME:#{null}}
    password: ${DB_PASSWORD:#{null}}
    hikari:
      initialization-fail-timeout: -1
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 60000
      validation-timeout: 10000
      leak-detection-threshold: 60000
      idle-timeout: 300000
      max-lifetime: 1800000

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.Oracle12cDialect
        format_sql: false
        proc:
          param_null_passing: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  sql:
    init:
      mode: never

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  oauth2:
    enabled: false
  ssl:
    enabled: false
  shutdown: graceful

basic-auth:
  config:
    enabled: false

http:
  session:
    enabled: false

info:
  build:
    artifact: 'url-management-service-api'
    description: '@project.description@'
    name: '@project.name@'
    version: '1.0-SNAPSHOT'

cobalt:
  encryption:
    enabled: false
    keysDir: file:${project.build.directory}/classes/security/encryptionkeys
    keyVersion: v1

external:
  service:
    client:
      ssl:
        enabled: true
        trustStore: classpath:certs/test.jks
        trustStorePassword: ''
        skipHostnameVerification: true
      connection:
        timeout: 6000
        readTimeout: 60000

decryption:
  config:
    enabled: true
    locations: /cust/security/encryptionKey

